services:
  - type: web
    name: brahma-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "https://brahma-web.antideploy.com,http://localhost:5173,http://localhost:3000"

