services:
  - type: web
    name: brahma-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false

  - type: web
    name: brahma-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
