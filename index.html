    <!-- Instant Splash / Boot Loader -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #06080c;
        color: #f8f6f0;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
      }

      #app-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #06080c;
        z-index: 99999;
        gap: 20px;
        transition: opacity 0.5s ease;
      }

      #app-boot-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .boot-logo-ring {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 2px solid rgba(212, 175, 55, 0.3);
        border-top-color: #d4af37;
        animation: bootSpin 1s linear infinite;
        position: relative;
      }

      .boot-logo-ring::after {
        content: 'ॐ';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        color: #d4af37;
        animation: bootSpin 1s linear infinite reverse;
      }

      .boot-label {
        font-family: 'Cinzel', serif;
        font-size: 0.9rem;
        letter-spacing: 3px;
        color: rgba(212, 175, 55, 0.85);
        text-transform: uppercase;
      }

      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
    </style>

  <body>
    <!-- Instant boot loader — hidden by JS after React mounts -->
    <div id="app-boot-loader">
      <div class="boot-logo-ring"></div>
      <span class="boot-label">Initializing BRAHMA Supreme OS</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hide boot loader after React mounts -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const check = setInterval(function () {
          if (window.__brahmaMounted) {
            clearInterval(check);
            const loader = document.getElementById('app-boot-loader');
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(function () { loader.remove(); }, 500);
            }
          }
        }, 60);

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
              console.log('SW registration note:', err);
            });
          });
        }
      });
    </script>
