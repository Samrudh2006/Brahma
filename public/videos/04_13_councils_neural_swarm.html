<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>04 — 13 Sacred Councils & 289 Swarms | BRAHMA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      user-select: none;
    }

    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .overlay-hud {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }
    .hud-title { font-size: 1.1rem; font-weight: 800; color: #fbbf24; }
    .hud-sub { font-size: 0.8rem; color: #94a3b8; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }

    #controls-bar {
      height: 64px;
      background: #090d16;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 18px;
      z-index: 50;
    }
    .btn-ctrl { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: #f8fafc; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
    .btn-ctrl.primary { background: #f59e0b; color: #000; border: none; }
    .progress-bar-container { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; cursor: pointer; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #ec4899); border-radius: 999px; width: 0%; }
    .time-readout { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #94a3b8; min-width: 90px; }
  </style>
</head>
<body>

  <div id="stage">
    <canvas id="neural-canvas"></canvas>

    <div class="overlay-hud">
      <div class="hud-title">🔱 13 Sacred Sanskrit Councils Mesh</div>
      <div class="hud-sub">289 Autonomous Swarm Nodes · P2P Consensus Active</div>
    </div>
  </div>

  <div id="controls-bar">
    <button class="btn-ctrl primary" id="btn-play">Pause</button>
    <button class="btn-ctrl" id="btn-restart">Restart</button>
    <div class="progress-bar-container" id="timeline">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <div class="time-readout" id="time-display">00:00 / 00:15</div>
  </div>

  <script>
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    const councils = [
      { name: "SAMVĀDA", glyph: "◈", color: "#f59e0b" },
      { name: "SṚṢṬI", glyph: "✦", color: "#38bdf8" },
      { name: "CHITRA", glyph: "▧", color: "#ec4899" },
      { name: "YANTRA", glyph: "⌁", color: "#10b981" },
      { name: "CHAKRAVYŪHA", glyph: "◎", color: "#a855f7" },
      { name: "ASTRA", glyph: "⚒", color: "#ef4444" },
      { name: "VIDYĀ", glyph: "◇", color: "#06b6d4" },
      { name: "SETU", glyph: "⛓", color: "#84cc16" },
      { name: "SAṄKALPA", glyph: "▣", color: "#f97316" },
      { name: "DŪTAVĀHA", glyph: "◉", color: "#14b8a6" },
      { name: "PRIYA", glyph: "☆", color: "#e879f9" },
      { name: "KĀLACAKRA", glyph: "◷", color: "#6366f1" },
      { name: "DHARMA", glyph: "☸", color: "#eab308" }
    ];

    let angleOffset = 0;
    const DURATION = 15;
    let time = 0;
    let isPlaying = true;
    let last = performance.now();

    function render(timestamp) {
      ctx.clearRect(0, 0, W, H);

      const cx = W / 2;
      const cy = H / 2;
      const radius = Math.min(W, H) * 0.35;

      angleOffset += 0.005;

      // Draw Center Hub (Brahma Core)
      ctx.beginPath();
      ctx.arc(cx, cy, 45, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#000';
      ctx.font = 'bold 22px Outfit';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔱', cx, cy);

      // Draw 13 Council Nodes
      const positions = councils.map((c, i) => {
        const theta = (i / councils.length) * Math.PI * 2 + angleOffset;
        const x = cx + Math.cos(theta) * radius;
        const y = cy + Math.sin(theta) * radius;
        return { x, y, ...c };
      });

      // Draw interconnecting neural filaments
      positions.forEach((p, idx) => {
        // Line to center
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = `rgba(245, 158, 11, 0.25)`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Line to neighbors
        const next = positions[(idx + 1) % positions.length];
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(next.x, next.y);
        ctx.strokeStyle = `rgba(56, 189, 248, 0.15)`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Node circle
        ctx.beginPath();
        ctx.arc(p.x, p.y, 24, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();

        // Glyph & Text
        ctx.fillStyle = p.color;
        ctx.font = '14px Outfit';
        ctx.fillText(p.glyph, p.x, p.y);

        ctx.font = '600 11px Outfit';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(p.name, p.x, p.y + 36);
      });
    }

    function loop(now) {
      const delta = (now - last) / 1000;
      last = now;

      if (isPlaying) {
        time += delta;
        if (time >= DURATION) time = 0;
      }

      const p = time / DURATION;
      document.getElementById('progress-bar').style.width = (p * 100) + '%';
      const curSec = Math.floor(time);
      document.getElementById('time-display').innerText = `00:${String(curSec).padStart(2, '0')} / 00:15`;

      render(now);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    const btnPlay = document.getElementById('btn-play');
    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.innerText = isPlaying ? 'Pause' : 'Play';
    });
    document.getElementById('btn-restart').addEventListener('click', () => {
      time = 0; isPlaying = true; btnPlay.innerText = 'Pause';
    });
    document.getElementById('timeline').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      time = ((e.clientX - rect.left) / rect.width) * DURATION;
    });
  </script>
</body>
</html>
