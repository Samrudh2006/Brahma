<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BRAHMA Video Studio — 7 High-Converting Frontier AI Compositions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 32px 40px;
    }

    header {
      max-width: 1400px;
      margin: 0 auto 36px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 40%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .stats-badge {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
    }

    /* Main Studio Container */
    .studio-container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
    }

    /* Left Playlist */
    .playlist {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .video-card:hover {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(251, 191, 36, 0.4);
      transform: translateX(4px);
    }
    .video-card.active {
      background: rgba(245, 158, 11, 0.12);
      border-color: #f59e0b;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #fbbf24;
      font-weight: 800;
    }
    .card-category {
      font-size: 0.70rem;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Right Player Stage */
    .player-stage {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .viewport-box {
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .viewport-box.vertical {
      aspect-ratio: 9 / 16;
      max-width: 440px;
      margin: 0 auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Prompt Box & Meta */
    .meta-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
    }
    .meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .meta-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .btn-copy {
      background: #f59e0b;
      color: #000;
      border: none;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-copy:hover { background: #d97706; }

    .prompt-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: #020617;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.5;
      user-select: all;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 class="brand-title">🔱 BRAHMA Video Studio</h1>
      <p class="brand-subtitle">The 7 High-Converting Code-Driven AI Video Compositions · Skillry Opus 5.5 Architecture</p>
    </div>
    <div class="stats-badge">
      7 / 7 COMPILED AT 60FPS · 100% REPRODUCIBLE
    </div>
  </header>

  <div class="studio-container">
    <!-- Left: Video Playlist -->
    <div class="playlist" id="playlist">
      <!-- Injected via JS -->
    </div>

    <!-- Right: Active Player & Prompt Studio -->
    <div class="player-stage">
      <div class="viewport-box" id="viewport-box">
        <iframe id="video-frame" src="01_hero_brand_title_takeover.html"></iframe>
      </div>

      <div class="meta-box">
        <div class="meta-header">
          <span class="meta-title" id="meta-title">VIRAL REPRODUCTION PROMPT</span>
          <div style="display: flex; gap: 8px;">
            <a id="btn-fullscreen" href="01_hero_brand_title_takeover.html" target="_blank" style="background: rgba(255,255,255,0.08); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; text-decoration: none; font-weight: 700;">
              Open Full Screen ↗
            </a>
            <button class="btn-copy" id="btn-copy">Copy Exact Prompt</button>
          </div>
        </div>
        <div class="prompt-text" id="prompt-text">
          Loading prompt...
        </div>
      </div>
    </div>
  </div>

  <script>
    const videos = [
      {
        id: 1,
        title: "01. Launch Title Scene Takeover",
        category: "Hero Brand Launch",
        file: "01_hero_brand_title_takeover.html",
        aspect: "16:9",
        desc: "3D kinetic typography & sacred Vedic Sri Yantra geometry introducing Brahma Level-4.2 AGI.",
        prompt: "Create a 15-second cinematic 60fps title scene takeover for BRAHMA Sovereign AGI Operating System. Dark obsidian radial gradient, sacred geometry golden mandala wireframe rotating in background, floating cyber particles, and massive kinetic typography with gold shimmer."
      },
      {
        id: 2,
        title: "02. Empirical Benchmark Showdown",
        category: "Metric Ticker & Proof",
        file: "02_empirical_benchmark_showdown.html",
        aspect: "16:9",
        desc: "Live animated odometer ticker showing 94.8% HumanEval, 0.021ms latency, 10.4x BitNet.",
        prompt: "Synthesize high-tech glassmorphism benchmark scoreboard with fast numeric odometer counters ticking up to 94.8% HumanEval Pass@1, 0.021ms Laya-Jev routing latency, 10.4x BitNet GEMM acceleration, and 17/17 Lean 4 formal invariants."
      },
      {
        id: 3,
        title: "03. ✦ SṚṢṬI Code-to-App Synthesis",
        category: "Full-Stack App Studio",
        file: "03_srshti_web_builder_timelapse.html",
        aspect: "16:9",
        desc: "Prompt -> Blueprint approval -> Live code compilation -> Live iframe hydration in 2.8s.",
        prompt: "Split-screen IDE workflow: Left panel accepts natural language prompt, approves architecture blueprint, streams clean React JSX code; right panel hydrates interactive DeFi hedge fund dashboard in 2.8s."
      },
      {
        id: 4,
        title: "04. 13 Councils & 289 Swarms",
        category: "Neural Topology Mesh",
        file: "04_13_councils_neural_swarm.html",
        aspect: "16:9",
        desc: "Visualizing the 13 Sanskrit councils delegating subtasks with energy pulses across 289 swarms.",
        prompt: "Interactive force-directed node topology graph featuring glowing central Brahma Core with 13 orbiting Sanskrit councils (Dhanvantari, Chanakya, Indra, Kuvera), connected by pulsating laser filaments showing real-time peer consensus."
      },
      {
        id: 5,
        title: "05. ⌁ YANTRA 2.0 Browser Swarm",
        category: "Autonomous Computer-Use",
        file: "05_yantra_headless_browser_swarm.html",
        aspect: "16:9",
        desc: "Headless Chrome CDP automation: Navigating, form filling, extracting preprints, and 24/7 watchdog.",
        prompt: "Dual-pane computer-use demonstration: Left terminal showing Chrome DevTools Protocol logs; right virtual browser showing simulated mouse cursor navigating arXiv, parsing paper abstracts, and capturing live viewport screenshots."
      },
      {
        id: 6,
        title: "06. Meta Coconut Latent Manifold",
        category: "Frontier Science Explainer",
        file: "06_meta_coconut_latent_reasoning.html",
        aspect: "16:9",
        desc: "Scientific explainer on continuous latent manifolds (arXiv:2412.06769) and Lean 4 formal verification.",
        prompt: "Scientific explainer visual showing comparison between discrete token generation entropy and continuous latent thought states (Coconut architecture), alongside Lean 4 formalized inductive safety theorems."
      },
      {
        id: 7,
        title: "07. OpenAI Dots Sovereign Alternative",
        category: "9:16 Viral Reel",
        file: "07_viral_reels_dots_alternative.html",
        aspect: "9:16",
        desc: "Vertical reel for TikTok / Reels: 'OpenAI just launched Dots. Meet the 100% Free Sovereign Alternative.'",
        prompt: "Fast-paced 9:16 mobile vertical reel with pulsing breaking news badge, high-contrast headline, bulleted checklist highlighting ₹0 self-hosted sovereignty, 24/7 background agent execution, and GitHub call-to-action."
      }
    ];

    let activeIndex = 0;

    function renderPlaylist() {
      const listEl = document.getElementById('playlist');
      listEl.innerHTML = videos.map((v, i) => `
        <div class="video-card ${i === activeIndex ? 'active' : ''}" onclick="selectVideo(${i})">
          <div class="card-top">
            <span class="card-num">#${v.id}</span>
            <span class="card-category">${v.category}</span>
          </div>
          <div class="card-title">${v.title}</div>
          <div class="card-desc">${v.desc}</div>
        </div>
      `).join('');
    }

    function selectVideo(index) {
      activeIndex = index;
      const v = videos[index];
      renderPlaylist();

      const viewport = document.getElementById('viewport-box');
      if (v.aspect === '9:16') {
        viewport.classList.add('vertical');
      } else {
        viewport.classList.remove('vertical');
      }

      document.getElementById('video-frame').src = v.file;
      document.getElementById('prompt-text').innerText = v.prompt;
      document.getElementById('btn-fullscreen').href = v.file;
    }

    document.getElementById('btn-copy').addEventListener('click', () => {
      const text = document.getElementById('prompt-text').innerText;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('btn-copy');
      btn.innerText = "✓ Copied!";
      setTimeout(() => { btn.innerText = "Copy Exact Prompt"; }, 2000);
    });

    // Initialize
    renderPlaylist();
    selectVideo(0);
  </script>
</body>
</html>
